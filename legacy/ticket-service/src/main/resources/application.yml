server:
  port: 8083
  error:
    include-message: always   # 讓 403/404 的原因回傳給呼叫端（之後 Agent 需要據此解釋）

spring:
  application:
    name: ticket-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri 只用來驗證 iss claim；有設 jwk-set-uri 時不會做 discovery
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/demo}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/demo/protocol/openid-connect/certs}

# 公司 profile API：查詢使用者在本系統的角色
profile:
  base-url: ${PROFILE_BASE_URL:http://localhost:8084}
  system: ticket
  cache-ttl: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
