# 前端與 API 同源：nginx 反向代理到舊系統後端，後端不需要開 CORS
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://logistics-service:8082;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /profile-api/ {
        proxy_pass http://profile-service:8084/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
